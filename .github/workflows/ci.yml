name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Check software WebGPU before the full suite
        env:
          DEBUG: pw:browser
        run: npm run build && xvfb-run -a npx playwright test tests/browser/three-backends.spec.ts --project=chromium-webgpu
      - run: xvfb-run -a npm run check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-results
          path: test-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: quilt-packages
          path: artifacts/packages/
  verify-artifacts:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: quilt-packages
          path: artifacts/packages/
      - name: Validate downloaded release archives without publishing
        run: RELEASE_VERSION=$(node -p "require('./package.json').version") node scripts/release.mjs
