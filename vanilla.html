<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/demos/style.css" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Quilt — Vanilla workspace</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body class="demo-page">
    <header class="demo-top">
      <a href="/" class="brand"
        ><img class="brand-icon" src="/android-chrome-192x192.png" width="29" height="29" alt="" />
        <span class="brand-wordmark">quilt</span><span class="version">__QUILT_VERSION__</span></a
      >
      <nav aria-label="Demo framework">
        <a href="/vanilla.html" aria-current="page">Vanilla TS</a><a href="/react.html">React</a>
        <a href="/electron.html">Electron</a><a href="/themes.html">Themes</a>
      </nav>
      <a class="source-link" href="https://github.com/niko-dellic/quilt">GitHub ↗</a>
    </header>
    <main class="demo-main">
      <div id="workspace"></div>
    </main>
    <dialog id="json-dialog" class="json-dialog">
      <h2>Workspace configuration</h2>
      <p>
        Edit the layout, theme, and tab-bar settings as JSON. Pane content is stored separately.
      </p>
      <textarea id="layout-json" aria-label="Layout JSON" spellcheck="false"></textarea>
      <p id="json-error" role="alert"></p>
      <div class="demo-actions">
        <button id="json-cancel">Cancel</button><button id="json-load">Load layout</button>
      </div>
    </dialog>
    <script type="module" src="/demos/vanilla.ts"></script>
  </body>
</html>
