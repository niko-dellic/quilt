<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/demos/style.css" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Quilt — Vanilla workspace</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body class="demo-page">
    <!--quilt-site-navbar-->
    <main id="VPContent" class="demo-main">
      <div id="workspace"></div>
    </main>
    <dialog id="json-dialog" class="json-dialog">
      <h2>Workspace configuration</h2>
      <p>
        Edit the layout, theme, and tab-bar settings as JSON. Pane content is stored separately.
      </p>
      <textarea id="layout-json" aria-label="Layout JSON" spellcheck="false"></textarea>
      <p id="json-error" role="alert"></p>
      <div class="demo-actions">
        <button id="json-cancel">Cancel</button><button id="json-load">Load layout</button>
      </div>
    </dialog>
    <script type="module" src="/demos/vanilla.ts"></script>
  </body>
</html>
